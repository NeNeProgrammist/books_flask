<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viemport" content="width=device-width, initial-scale = 1.0">
    <title>{% block title %}Гостевая книга{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 0 auto; padding: 20px; background: f5f5f5; }
        nav a { margin-right: 15px; color: #0055aa; }
        .flash { padding: 10px; border-radius: 6px; margin-bottom: 10px}
        .success { background: #d4edda }
        .error { background: #f8d7da }
        .message { background: white; padding: 12px; border-radius: 8px; margin-bottom: 10px }
        .message small { color: #888; margin-left: 10px; }
    </style>
</head>
<body>
    <nav>
        <a href="{{ url_for('index') }}">Главная</a>
        <a href="{{ url_for('about') }}">О книге</a>
        <a href="{{ url_for('books') }}">Заголовки</a>
    </nav>
    {% with flashes = get_flashed_messages(with_categories=true) %}
    {% for category, text in flashes %}
        <div class="flash {{ category }}">{{text}}</div>
    {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</body>
</html>
